<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle — ไพ่ทาโรต์</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--void:#04020a;--gold:#dfb97e;--gold-pale:#f7e8c4;--gold-dark:#8c6533;--chamber:#140824}
html,body{height:100%;overflow-x:hidden;background:var(--void);font-family:'Cinzel',serif;color:var(--gold-pale)}

/* STARS & GALAXY BACKGROUND */
#galaxyCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* FLASH EFFECT */
#flash{position:fixed;inset:0;z-index:9999;background:rgba(255,220,100,0);pointer-events:none;transition:background .2s ease}
#flash.on{background:rgba(255,220,100,.7)}

/* LANDING PAGE */
#landing{
  position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 30%, #160b2e 0%, #06030f 80%);
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;overflow:hidden;
  transition:opacity 1s cubic-bezier(0.4, 0, 0.2, 1),transform 1s cubic-bezier(0.4, 0, 0.2, 1);
}
#landing.gone{opacity:0;pointer-events:none;transform:scale(1.08)}
.ceiling{width:100%;height:6px;background:linear-gradient(90deg,transparent 20%,#4a3315 50%,transparent 80%);box-shadow:0 2px 10px rgba(0,0,0,.8);flex-shrink:0}
.rope-wrap{display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:sw 4s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(212,165,90,.4))}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.rope-wrap.pull{animation:rp .5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards}
@keyframes rp{40%{transform:translateY(55px) rotate(2.5deg)}100%{transform:translateY(45px) rotate(0deg)}}
.hook{width:22px;height:14px;border:2px solid #6b4c24;border-bottom:none;border-radius:10px 10px 0 0;margin-bottom:-2px}
.rope{width:8px;background:repeating-linear-gradient(170deg,#4a3315 0,#6b4c24 3px,#35220c 6px,#593d1b 9px);border-radius:4px;box-shadow:inset 0 0 5px rgba(0,0,0,.5)}
.knot{width:19px;height:12px;background:radial-gradient(ellipse,#9c7038,#593d1b);border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.lantern{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 0 25px rgba(255,180,60,.6));transition:filter .3s}
.lantern.lit{filter:drop-shadow(0 0 70px rgba(255,220,100,1)) drop-shadow(0 0 140px rgba(255,140,30,.8))}
.lt{width:48px;height:12px;background:linear-gradient(135deg,#8c6533,#4a3315,#8c6533);border-radius:4px 4px 0 0;border:1px solid #6b4c24}
.lb{width:68px;height:98px;border:2px solid #8c6533;border-radius:6px;background:radial-gradient(ellipse at 50% 60%,rgba(255,190,70,.25),rgba(255,120,20,.08) 60%,transparent);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.lb::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(140,100,40,.15) 0,rgba(140,100,40,.15) 1px,transparent 1px,transparent 16px),repeating-linear-gradient(0deg,rgba(140,100,40,.15) 0,rgba(140,100,40,.15) 1px,transparent 1px,transparent 16px)}
.lf{font-size:2rem;z-index:1;animation:fl 1.5s ease-in-out infinite alternate}
@keyframes fl{0%{opacity:.7;transform:scale(.85)}100%{opacity:1;transform:scale(1.15)}}
.lbase{width:48px;height:10px;background:linear-gradient(135deg,#8c6533,#4a3315);border-radius:0 0 4px 4px}
.l-hint{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.35em;color:rgba(223,185,126,.6);margin-top:1.8rem;animation:bk 3s ease-in-out infinite}
@keyframes bk{0%,100%{opacity:.3}50%{opacity:.9}}

.rune{position:fixed;font-family:'Cinzel',serif;color:rgba(223,185,126,.07);pointer-events:none;z-index:0;animation:rn 6s ease-in-out infinite var(--dl,0s)}
@keyframes rn{0%,100%{opacity:.04}50%{opacity:.12}}

/* APP CONTAINER */
#app{
  position:fixed;inset:0;z-index:1;background:radial-gradient(circle at 50% 40%, #1a0d36 0%, #080414 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 1.2s ease .4s;overflow-y:auto;padding:2rem 1rem
}
#app.on{opacity:1;pointer-events:all}
.app-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,2.5vw,1.6rem);color:var(--gold);letter-spacing:.25em;text-align:center;text-shadow:0 0 25px rgba(223,185,126,.4);margin-bottom:.15rem}
.app-sub{font-family:'Sarabun',sans-serif;font-weight:300;font-size:.7rem;color:rgba(223,185,126,.5);letter-spacing:.3em;text-align:center;margin-bottom:1.5rem}

/* MAIN LAYOUT */
.main-layout{
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  width:100%;max-width:1050px;
  position:relative;z-index:10;
  gap:0 1.5rem;
}
.witch-col{
  grid-column:2;
  display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;
}
.bubble-col{
  grid-column:3;
  display:flex;
  flex-direction:column;
}

/* SPEECH BUBBLE */
.bubble{
  background:linear-gradient(135deg,rgba(28,14,52,.95),rgba(14,6,28,.98));
  border:1.5px solid rgba(223,185,126,.35);border-radius:12px;
  padding:1.1rem 1.3rem;
  opacity:0;transform:translateX(15px) scale(.95);
  transition:opacity .5s ease,transform .5s ease;
  position:relative;
  box-shadow:0 10px 35px rgba(0,0,0,.65),inset 0 1px 0 rgba(223,185,126,.15),0 0 20px rgba(120,70,200,.2);
  width:100%;
}
.bubble::before{
  content:'';position:absolute;
  left:-13px;top:32px;
  width:0;height:0;
  border-top:9px solid transparent;
  border-bottom:9px solid transparent;
  border-right:13px solid rgba(223,185,126,.35);
}
.bubble::after{
  content:'';position:absolute;
  left:-10px;top:33px;
  width:0;height:0;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:10px solid rgba(28,14,52,.95);
}
.bubble.on{opacity:1;transform:translateX(0) scale(1)}
.bubble-title{font-family:'Cinzel',serif;font-size:.75rem;color:var(--gold);letter-spacing:.12em;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem;text-shadow:0 0 10px rgba(223,185,126,.3)}
.bubble-text{font-family:'Sarabun',sans-serif;font-weight:300;font-size:.82rem;line-height:1.8;color:rgba(247,232,196,.9);word-break:break-word}
.cursor{display:inline-block;width:2px;height:.9em;background:var(--gold);margin-left:2px;animation:cur .7s infinite}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}

/* WITCH SECTION */
.witch-section{
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}
.witch-svg{
  width:clamp(180px,24vw,280px);
  height:auto;
  filter:
    drop-shadow(0 0 25px rgba(140,90,240,.45))
    drop-shadow(0 0 50px rgba(90,50,200,.3))
    drop-shadow(0 15px 35px rgba(0,0,0,.6));
  position:relative;z-index:5;
}

/* TABLE SECTION */
.table-section{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:100%;margin-top:.7rem}
.table-top{
  width:clamp(220px,30vw,360px);height:clamp(100px,13vw,160px);
  background:radial-gradient(ellipse 60% 40% at 40% 30%,rgba(255,255,255,.08),transparent 60%),radial-gradient(ellipse 100% 100%,#4a3315,#2e1c0c 60%,#140b04);
  border:4px solid #7a5228;border-radius:12px 12px 0 0;
  box-shadow:0 0 0 2px #a3753d,0 -10px 30px rgba(0,0,0,.5),inset 0 3px 15px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.table-top::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(15deg,transparent 0,rgba(0,0,0,.03) 1px,transparent 2px,transparent 8px)}
.table-leg{width:clamp(160px,22vw,270px);height:clamp(16px,2.8vw,26px);background:linear-gradient(180deg,#593d1b,#2e1c0c);border:2px solid #7a5228;border-top:none;border-radius:0 0 8px 8px;box-shadow:0 5px 15px rgba(0,0,0,.7)}

.deck-zone{display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer;transition:transform .3s cubic-bezier(0.3, 1.5, 0.7, 1);z-index:20;-webkit-tap-highlight-color:transparent}
.deck-zone:hover{transform:scale(1.1) translateY(-3px)}
.deck-zone:active{transform:scale(.95)}
.deck-stack{position:relative;width:58px;height:90px}
.dc{position:absolute;width:56px;height:86px;background:linear-gradient(135deg,#1c0e38,#341c63);border:2px solid var(--gold);border-radius:5px;box-shadow:3px 3px 8px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:rgba(223,185,126,.3)}
.dc:nth-child(1){top:4px;left:2px;transform:rotate(-3deg)}
.dc:nth-child(2){top:2px;left:1px;transform:rotate(-1.5deg)}
.dc:nth-child(3){top:0;left:0}
.deck-lbl{font-size:.58rem;letter-spacing:.18em;color:rgba(223,185,126,.6);font-family:'Cinzel',serif}

/* DRAWN CARD */
.drawn-card{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-4deg);
  width:54px;height:84px;
  background:linear-gradient(160deg,#fcf6e8,#e8d6ad);
  border:2px solid var(--gold);border-radius:5px;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 15px rgba(223,185,126,.4);
  font-size:1.6rem;animation:crd .8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;z-index:25
}
.drawn-card.show{display:flex}
@keyframes crd{
  0%{transform:translate(-50%,-50%) rotate(-4deg) scale(.5) rotateY(180deg); opacity:0;}
  100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1) rotateY(0deg); opacity:1;}
}
.drawn-num{font-size:.45rem;letter-spacing:.12em;color:var(--gold-dark);font-family:'Cinzel',serif;font-weight:600}
.tc-candle{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.tc-f{font-size:.8rem;animation:fl 1.4s ease-in-out infinite alternate;line-height:1;filter:drop-shadow(0 0 6px rgba(255,200,80,.8))}
.tc-b{width:7px;height:20px;background:linear-gradient(180deg,#fcf6e8,#d9c79e);border-radius:2px;box-shadow:0 0 10px rgba(255,200,80,.3)}
.tc1{left:10%;top:18%}.tc2{right:12%;top:22%}

/* RESPONSIVE DESIGN */
@media(max-width: 768px) {
  .main-layout {
    grid-template-columns: 1fr;
    gap: 1.8rem;
    align-items: center;
  }
  .bubble-col {
    grid-column: 1;
    width: 100%;
    max-width: 340px;
  }
  .bubble::before, .bubble::after {
    display: none;
  }
}
</style>
</head>
<body>
<div id="flash"></div>
<canvas id="galaxyCanvas"></canvas>
<div class="rune" style="top:12%;left:6%;font-size:2.2rem;--dl:0s">ᚱ</div>
<div class="rune" style="top:7%;right:7%;font-size:1.6rem;--dl:1.5s">ᛟ</div>
<div class="rune" style="bottom:12%;left:8%;font-size:1.9rem;--dl:1s">ᛉ</div>
<div class="rune" style="bottom:9%;right:6%;font-size:1.5rem;--dl:2.5s">ᚹ</div>

<!-- LANDING -->
<div id="landing">
  <div class="ceiling"></div>
  <div id="rope" class="rope-wrap">
    <div class="hook"></div>
    <div class="rope" style="height:170px"></div>
    <div class="knot"></div>
    <div class="rope" style="height:75px"></div>
    <div class="lantern" id="lantern">
      <div class="lt"></div>
      <div class="lb"><div class="lf">🕯</div></div>
      <div class="lbase"></div>
    </div>
  </div>
  <div class="l-hint">· ดึงโคมไฟเพื่อเปิดห้องแห่งโชคชะตา ·</div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-title">ห้องแห่งโชคชะตา</div>
  <div class="app-sub">CHAMBER OF FATE</div>

  <div class="main-layout">
    <!-- WITCH + TABLE -->
    <div class="witch-col">
      <div class="witch-section">
        <!-- SVG แม่มดตกแต่ง -->
        <svg id="witchSvg" class="witch-svg" width="720" height="820" viewBox="0 0 720 820" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGrad" cx="50%" cy="45%" r="50%">
              <stop offset="0%" stop-color="#4a327a"/>
              <stop offset="50%" stop-color="#2a1b4e"/>
              <stop offset="100%" stop-color="#100824"/>
            </radialGradient>
          </defs>
          <ellipse transform="translate(87 78)" cx="273" cy="297" rx="273" ry="297" fill="url(#bgGrad)"/>
          <path transform="translate(89 224)" d="M10.5 0C11.48 6.02 14.98 9.52 21 10.5C14.98 11.48 11.48 14.98 10.5 21C9.52 14.98 6.02 11.48 0 10.5C6.02 9.52 9.52 6.02 10.5 0Z" fill="#F7E8C4"/>
          <path transform="translate(601 231)" d="M13 0C14.2133 7.45333 18.5467 11.7867 26 13C18.5467 14.2133 14.2133 18.5467 13 26C11.7867 18.5467 7.45333 14.2133 0 13C7.45333 11.7867 11.7867 7.45333 13 0Z" fill="#F7E8C4"/>
        </svg>
      </div>
      <div class="table-section">
        <div class="table-top">
          <div class="tc-candle tc1"><div class="tc-f">🕯</div><div class="tc-b"></div></div>
          <div class="tc-candle tc2"><div class="tc-f">🕯</div><div class="tc-b"></div></div>
          <div class="deck-zone" id="tableDeck">
            <div class="deck-stack">
              <div class="dc"></div><div class="dc"></div><div class="dc"></div>
            </div>
            <span class="deck-lbl">เลือกไพ่</span>
          </div>
          <div class="drawn-card" id="drawnCard">
            <span class="drawn-num" id="drawnNum">X</span>
            <span id="drawnEmoji">🌟</span>
          </div>
        </div>
        <div class="table-leg"></div>
      </div>
    </div>

    <!-- BUBBLE -->
    <div class="bubble-col">
      <div class="bubble on" id="bubbleBox">
        <div class="bubble-title" id="bubbleTitle">✨ WHEEL OF FORTUNE · วงล้อโชคชะตา</div>
        <div class="bubble-text" id="bubbleText">โชค การเปลี่ยนแปลง และวัฏจักร ชีวิตหมุนวนเสมอ จงตั้งรับกับการเปลี่ยนแปลงด้วยใจเปิดกว้าง<span class="cursor"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Script พื้นหลังดวงดาวระยิบระยับ
  const canvas = document.getElementById('galaxyCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 80 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 1.8,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function animateStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.alpha += s.speed;
      if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
      ctx.fillStyle = `rgba(247, 232, 196, ${Math.abs(s.alpha)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(animateStars);
  }
  animateStars();

  // ตัวอย่างลูกเล่นคลิกดึงโคมไฟเข้าแอป
  document.getElementById('landing').addEventListener('click', () => {
    document.getElementById('rope').classList.add('pull');
    document.getElementById('lantern').classList.add('lit');
    document.getElementById('flash').classList.add('on');
    setTimeout(() => {
      document.getElementById('landing').classList.add('gone');
      document.getElementById('app').classList.add('on');
    }, 400);
  });
</script>
</body>
</html>
