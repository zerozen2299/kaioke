<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle — ไพ่ทาโรต์</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--void:#06030f;--gold:#c9a96e;--gold-pale:#e8d5a3;--gold-dark:#7a5a2e;--chamber:#1a0d2e}
html,body{height:100%;overflow:hidden;background:var(--void);font-family:'Cinzel',serif}

/* STARS */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
/* ดาวใหญ่ — 4-pointed */
.star{position:absolute;pointer-events:none;animation:tw var(--d,3s) ease-in-out infinite var(--dl,0s)}
.star::before,.star::after{content:'';position:absolute;background:var(--gold-pale);border-radius:99px;top:50%;left:50%;transform:translate(-50%,-50%)}
.star::before{width:100%;height:20%}.star::after{width:20%;height:100%}
.sglow{position:absolute;inset:-80%;border-radius:50%;background:radial-gradient(circle,rgba(232,213,163,.25) 0%,transparent 70%)}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.88) rotate(0deg)}50%{opacity:var(--op,1);transform:scale(1.12) rotate(8deg)}}
/* ดาวจุดเล็ก */
.dot-star{position:absolute;border-radius:50%;background:#fff;pointer-events:none;animation:dtw var(--d,4s) ease-in-out infinite var(--dl,0s)}
@keyframes dtw{0%,100%{opacity:var(--mn,.05)}50%{opacity:var(--op,.55)}}

/* FLASH */
#flash{position:fixed;inset:0;z-index:9999;background:rgba(255,220,100,0);pointer-events:none;transition:background .15s}
#flash.on{background:rgba(255,220,100,.6)}

/* LANDING — มืดสนิท */
#landing{
  position:fixed;inset:0;z-index:500;background:#000;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;overflow:hidden;
  transition:opacity .9s ease,transform .9s ease;
}
#landing.gone{opacity:0;pointer-events:none;transform:scale(1.04)}
.ceiling{width:100%;height:5px;background:linear-gradient(90deg,transparent 30%,#3a2810 50%,transparent 70%);flex-shrink:0}
.rope-wrap{display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:sw 3.5s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(180,130,60,.35))}
@keyframes sw{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.rope-wrap.pull{animation:rp .45s ease-out forwards}
@keyframes rp{40%{transform:translateY(52px) rotate(2deg)}100%{transform:translateY(44px) rotate(0deg)}}
.hook{width:20px;height:13px;border:2px solid #5a3d1e;border-bottom:none;border-radius:10px 10px 0 0;margin-bottom:-2px}
.rope{width:7px;background:repeating-linear-gradient(170deg,#5a3d1e 0,#7a5a30 3px,#4a2e10 6px,#6b4c2a 9px);border-radius:3px;box-shadow:0 0 6px rgba(140,90,30,.3)}
.knot{width:17px;height:11px;background:radial-gradient(ellipse,#8a6030,#5a3d1e);border-radius:50%}
.lantern{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 0 20px rgba(255,180,60,.5));transition:filter .2s}
.lantern.lit{filter:drop-shadow(0 0 60px rgba(255,220,100,.95)) drop-shadow(0 0 120px rgba(255,140,30,.7))}
.lt{width:44px;height:11px;background:linear-gradient(135deg,#7a5228,#4a2e10,#7a5228);border-radius:3px 3px 0 0;border:1px solid #5a3d1e}
.lb{width:62px;height:90px;border:2px solid #7a5228;border-radius:5px;background:radial-gradient(ellipse at 50% 60%,rgba(255,170,50,.18),rgba(255,120,20,.06) 60%,transparent);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.lb::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(120,80,30,.12) 0,rgba(120,80,30,.12) 1px,transparent 1px,transparent 14px),repeating-linear-gradient(0deg,rgba(120,80,30,.12) 0,rgba(120,80,30,.12) 1px,transparent 1px,transparent 14px)}
.lf{font-size:1.8rem;z-index:1;animation:fl 1.6s ease-in-out infinite alternate}
@keyframes fl{0%{opacity:.65;transform:scale(.86)}100%{opacity:1;transform:scale(1.1)}}
.lbase{width:44px;height:9px;background:linear-gradient(135deg,#7a5228,#4a2e10);border-radius:0 0 3px 3px}
.l-hint{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.3em;color:rgba(140,100,40,.55);margin-top:1.4rem;animation:bk 3s ease-in-out infinite}
@keyframes bk{0%,100%{opacity:.2}50%{opacity:.6}}
.rune{position:fixed;font-family:'Cinzel',serif;color:rgba(201,169,110,.055);pointer-events:none;z-index:0;animation:rn 5s ease-in-out infinite var(--dl,0s)}
@keyframes rn{0%,100%{opacity:.03}50%{opacity:.09}}

/* APP */
#app{position:fixed;inset:0;z-index:1;background:#16182F;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s ease .35s;overflow:hidden}
#app.on{opacity:1;pointer-events:all}
.app-title{font-family:'Cinzel Decorative',serif;font-size:clamp(.85rem,2.2vw,1.4rem);color:var(--gold);letter-spacing:.2em;text-align:center;text-shadow:0 0 28px rgba(201,169,110,.28);margin-bottom:.1rem}
.app-sub{font-family:'Sarabun',sans-serif;font-weight:300;font-size:.65rem;color:rgba(201,169,110,.4);letter-spacing:.22em;text-align:center;margin-bottom:1rem}

/* MAIN LAYOUT — grid 3 คอลัมน์: [space] [witch+table] [bubble] */
.main-layout{
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:start;
  width:100%;max-width:1000px;padding:0 1rem;
  position:relative;z-index:10;
  gap:0 1rem;
}
/* witch + table อยู่คอลัมน์กลาง */
.witch-col{
  grid-column:2;
  display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;
}
/* bubble อยู่คอลัมน์ขวา จัดลงมาให้ตรงกับหน้าแม่มด
   SVG สูง 820px แม่มดอยู่ที่ ~85-250px (10-30%) ของ SVG
   witch-svg แสดงที่ความสูง clamp(160-260px)
   หน้าแม่มดอยู่ที่ประมาณ 35-45% ของ SVG */
.bubble-col{
  grid-column:3;
  display:flex;
  flex-direction:column;
  padding-top:clamp(30px,6vw,70px); /* ดันลงมาให้ตรงหน้า */
}
.bubble{
  background:linear-gradient(135deg,rgba(22,10,40,.97),rgba(14,6,28,.99));
  border:1px solid rgba(201,169,110,.25);border-radius:10px;
  padding:.85rem 1rem;
  opacity:0;transform:translateX(10px) scale(.95);
  transition:opacity .45s ease,transform .45s ease;
  position:relative;
  box-shadow:0 8px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(201,169,110,.07);
  width:100%;
}
/* tail ชี้ซ้ายไปหาแม่มด */
.bubble::before{
  content:'';position:absolute;
  left:-11px;top:28px;
  width:0;height:0;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:11px solid rgba(201,169,110,.25);
}
.bubble::after{
  content:'';position:absolute;
  left:-9px;top:29px;
  width:0;height:0;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
  border-right:9px solid rgba(22,10,40,.97);
}
.bubble.on{opacity:1;transform:translateX(0) scale(1)}
.bubble-title{font-family:'Cinzel',serif;font-size:.68rem;color:var(--gold);letter-spacing:.1em;margin-bottom:.4rem;display:flex;align-items:center;gap:.35rem}
.bubble-text{font-family:'Sarabun',sans-serif;font-weight:300;font-size:.78rem;line-height:1.9;color:rgba(232,213,163,.85);min-height:55px}
.cursor{display:inline-block;width:2px;height:.88em;background:var(--gold);margin-left:1px;animation:cur .7s infinite}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}

/* WITCH SECTION (inside witch-col) */
.witch-section{
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}
/* SVG witch */
.witch-svg{
  width:clamp(160px,22vw,260px);
  height:auto;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));
  position:relative;z-index:5;
}
/* shuffle animation on SVG cards */
.witch-svg.shuffling #________________________________________5,
.witch-svg.shuffling #_____________________________________3{
  animation-duration:.5s !important;
  animation-timing-function:ease-in-out !important;
}
/* speaking mouth animation */
@keyframes speak{0%,100%{transform:scaleY(1)}50%{transform:scaleY(0.2)}}
.witch-svg.speaking #___________________7{
  animation:speak .18s steps(1) infinite !important;
}

.witch-label{font-family:'Sarabun',sans-serif;font-size:.58rem;color:rgba(201,169,110,.35);letter-spacing:.14em;margin-top:.2rem}

/* TABLE */
.table-section{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:100%}
.table-top{
  width:clamp(200px,28vw,340px);height:clamp(90px,12vw,150px);
  background:radial-gradient(ellipse 60% 40% at 40% 30%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse 100% 100%,#3d2810,#2a1c0a 60%,#1a1008);
  border:4px solid #6b4c2a;border-radius:10px 10px 0 0;
  box-shadow:0 0 0 2px #8a6234,0 -8px 24px rgba(0,0,0,.4),inset 0 2px 12px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.table-top::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(15deg,transparent 0,rgba(0,0,0,.02) 1px,transparent 2px,transparent 7px)}
.table-leg{width:clamp(150px,20vw,255px);height:clamp(14px,2.5vw,24px);background:linear-gradient(180deg,#4a3015,#2a1c0a);border:2px solid #6b4c2a;border-top:none;border-radius:0 0 6px 6px}

.deck-zone{display:flex;flex-direction:column;align-items:center;gap:.35rem;cursor:pointer;transition:transform .25s;z-index:20;-webkit-tap-highlight-color:transparent}
.deck-zone:hover{transform:scale(1.07)}
.deck-zone:active{transform:scale(.96)}
.deck-stack{position:relative;width:54px;height:84px}
.dc{position:absolute;width:52px;height:80px;background:linear-gradient(135deg,#1a0d2e,#2d1b4e);border:2px solid var(--gold-dark);border-radius:4px;box-shadow:2px 2px 5px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:rgba(201,169,110,.22)}
.dc:nth-child(1){top:3px;left:2px;transform:rotate(-2.5deg)}
.dc:nth-child(2){top:1.5px;left:1px;transform:rotate(-1deg)}
.dc:nth-child(3){top:0;left:0}
.deck-lbl{font-size:.54rem;letter-spacing:.15em;color:rgba(201,169,110,.48);font-family:'Cinzel',serif}

/* drawn card on table */
.drawn-card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-4deg);width:50px;height:77px;background:linear-gradient(160deg,#f0e6c8,#e0d0a8);border:2px solid var(--gold-dark);border-radius:4px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 10px rgba(201,169,110,.2);font-size:1.5rem;animation:crd .7s ease-out forwards;z-index:25}
.drawn-card.show{display:flex}
@keyframes crd{0%{transform:translate(-50%,-50%) rotate(-4deg) scale(.65) rotateY(180deg)}100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1) rotateY(0deg)}}
.drawn-num{font-size:.4rem;letter-spacing:.1em;color:var(--gold-dark);font-family:'Cinzel',serif}
.tc-candle{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.tc-f{font-size:.7rem;animation:fl 1.3s ease-in-out infinite alternate;line-height:1}
.tc-b{width:6px;height:18px;background:linear-gradient(180deg,#f0e6c8,#d4c4a0);border-radius:2px;box-shadow:0 0 8px rgba(255,200,80,.22)}
.tc1{left:8%;top:18%}.tc2{right:10%;top:22%}

/* OVERLAY */
#ov{position:fixed;inset:0;z-index:800;background:rgba(6,3,15,.9);backdrop-filter:blur(5px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem}
#ov.on{display:flex}
.ov-deck{position:relative;width:78px;height:120px;cursor:pointer;transition:transform .25s}
.ov-deck:hover{transform:scale(1.05)}
.odc{position:absolute;width:74px;height:116px;background:linear-gradient(135deg,#1a0d2e,#2d1b4e);border:2px solid var(--gold-dark);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:rgba(201,169,110,.2);box-shadow:2px 2px 7px rgba(0,0,0,.5)}
.odc:nth-child(1){top:4px;left:2px;transform:rotate(-2deg)}
.odc:nth-child(2){top:2px;left:1px;transform:rotate(-1deg)}
.odc:nth-child(3){top:0;left:0}
.ov-hint{font-family:'Sarabun',sans-serif;font-weight:300;font-size:.78rem;color:rgba(201,169,110,.48);letter-spacing:.14em;text-align:center}
.sc{position:absolute;top:0;left:0;width:74px;height:116px;background:linear-gradient(135deg,#1a0d2e,#2d1b4e);border:2px solid var(--gold-dark);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:rgba(201,169,110,.2);animation:sa .4s ease-in-out forwards}
@keyframes sa{0%{transform:translate(0,0) rotate(0)}35%{transform:translate(var(--tx,50px),var(--ty,-25px)) rotate(var(--r,13deg))}70%{transform:translate(var(--tx2,-35px),var(--ty2,15px)) rotate(var(--r2,-8deg))}100%{transform:translate(0,0) rotate(0)}}
.btn-sh,.btn-dr{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.18em;color:var(--gold);background:transparent;border:1px solid rgba(201,169,110,.32);padding:.65rem 1.7rem;cursor:pointer;transition:all .25s;-webkit-tap-highlight-color:transparent}
.btn-sh:hover,.btn-dr:hover{border-color:var(--gold);box-shadow:0 0 15px rgba(201,169,110,.15)}
.btn-dr{color:var(--gold-pale);border-color:var(--gold);font-size:.85rem}
.btn-again{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.15em;color:rgba(201,169,110,.45);background:transparent;border:1px solid rgba(201,169,110,.13);padding:.4rem 1.2rem;cursor:pointer;transition:all .25s;margin-top:.5rem;display:none}
.btn-again.on{display:inline-block}
.btn-again:hover{color:var(--gold);border-color:rgba(201,169,110,.28)}
</style>
</head>
<body>
<div id="flash"></div>
<div id="stars"></div>
<div class="rune" style="top:15%;left:5%;font-size:2rem;--dl:0s">ᚱ</div>
<div class="rune" style="top:8%;right:6%;font-size:1.5rem;--dl:1.5s">ᛟ</div>
<div class="rune" style="bottom:10%;left:7%;font-size:1.8rem;--dl:1s">ᛉ</div>
<div class="rune" style="bottom:8%;right:5%;font-size:1.4rem;--dl:2.5s">ᚹ</div>

<!-- LANDING -->
<div id="landing">
  <div class="ceiling"></div>
  <div id="rope" class="rope-wrap">
    <div class="hook"></div>
    <div class="rope" style="height:160px"></div>
    <div class="knot"></div>
    <div class="rope" style="height:70px"></div>
    <div class="lantern" id="lantern">
      <div class="lt"></div>
      <div class="lb"><div class="lf">🕯</div></div>
      <div class="lbase"></div>
    </div>
  </div>
  <div class="l-hint">· ดึงโคมไฟ ·</div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-title">ห้องแห่งโชคชะตา</div>
  <div class="app-sub">CHAMBER OF FATE</div>

  <div class="main-layout">

    <!-- WITCH + TABLE (ซ้าย) -->
    <div class="witch-col">
    <div class="witch-section">
      <!-- SVG แม่มด -->
      <svg id="witchSvg" class="witch-svg" width="720" height="820" viewBox="0 0 720 820" fill="none" xmlns="http://www.w3.org/2000/svg">

<script>

  {n:'IX',name:'THE HERMIT',th:'ฤาษี',e:'🏮',m:'การหาคำตอบจากภายใน ความสงัด บางครั้งคำตอบอยู่ในความเงียบของใจ จงใช้เวลาอยู่กับตัวเอง'},
  {n:'X',name:'WHEEL OF FORTUNE',th:'วงล้อโชคชะตา',e:'🎡',m:'โชค การเปลี่ยนแปลง และวัฏจักร ชีวิตหมุนวนเสมอ จงตั้งรับกับการเปลี่ยนแปลงด้วยใจเปิดกว้าง'},
  {n:'XI',name:'JUSTICE',th:'ความยุติธรรม',e:'⚖️',m:'ความยุติธรรม ความสมดุล และความจริง ทุกการกระทำมีผลตอบแทน ถึงเวลาพิจารณาด้วยความเป็นกลาง'},
  {n:'XII',name:'THE HANGED MAN',th:'ชายที่ถูกแขวน',e:'🔄',m:'การยอมรับ การรอคอย และการมองต่างมุม บางครั้งการหยุดนิ่งคือการกระทำที่ดีที่สุด'},
  {n:'XIII',name:'DEATH',th:'การเปลี่ยนผ่าน',e:'🌑',m:'การสิ้นสุดของบทหนึ่งและการเริ่มต้นบทใหม่ จงปล่อยวางในสิ่งที่ไม่อาจดำรงอยู่ได้อีก'},
  {n:'XIV',name:'TEMPERANCE',th:'ความพอดี',e:'🏺',m:'ความสมดุล ความอดทน และการปรับตัว ความยั่งยืนมาจากการผสมผสานที่ลงตัว'},
  {n:'XV',name:'THE DEVIL',th:'ปีศาจ',e:'🔗',m:'การยึดติดและกับดักที่สร้างขึ้นเอง โซ่ตรวนอยู่ในใจ ถึงเวลาปลดปล่อยตัวเอง'},
  {n:'XVI',name:'THE TOWER',th:'หอคอย',e:'⚡',m:'การพังทลายที่นำมาซึ่งการตื่นรู้ จากซากปรักหักพัง โอกาสใหม่จะปรากฏขึ้นเสมอ'},
  {n:'XVII',name:'THE STAR',th:'ดาว',e:'⭐',m:'ความหวัง การรักษา และแรงบันดาลใจ หลังความมืดมน แสงดาวยังส่องสว่าง ทุกอย่างจะดีขึ้น'},
  {n:'XVIII',name:'THE MOON',th:'พระจันทร์',e:'🌕',m:'ภาพลวงตา ความลึกลับ และจิตใต้สำนึก สิ่งต่างๆ อาจไม่เป็นอย่างที่มองเห็น จงเชื่อสัญชาตญาณ'},
  {n:'XIX',name:'THE SUN',th:'พระอาทิตย์',e:'☀️',m:'ความสุข ความสำเร็จ และความมีชีวิตชีวา พลังงานบวกกำลังหลั่งไหลเข้ามา ความสุขกำลังรอคุณอยู่'},
  {n:'XX',name:'JUDGEMENT',th:'วันพิพากษา',e:'📯',m:'การตื่นขึ้น ถึงเวลาประเมินชีวิตอีกครั้ง จงให้อภัยทั้งตัวเองและผู้อื่น การตื่นรู้ครั้งใหม่กำลังมาถึง'},
  {n:'XXI',name:'THE WORLD',th:'โลก',e:'🌍',m:'การสำเร็จและความสมบูรณ์ คุณมาถึงจุดสุดยอดของการเดินทาง บทเรียนทั้งหมดได้รับการเรียนรู้แล้ว'}
];

/* STARS */
(function(){
  const sl=document.getElementById('stars');
  // ดาวใหญ่ 4-pointed
  [[14,22,8],[5,11,20],[2,4,30]].forEach(([mn,mx,cnt],ti)=>{
    for(let i=0;i<cnt;i++){
      const d=document.createElement('div');d.className='star';
      const sz=mn+Math.random()*(mx-mn);
      d.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*95}%;left:${Math.random()*95}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*6}s;--op:${[1,.85,.6][ti]}`;
      if(ti<2){const g=document.createElement('div');g.className='sglow';d.appendChild(g);}
      sl.appendChild(d);
    }
  });
  // ดาวจุดเล็กมาก — กระจายทั่ว bg
  for(let i=0;i<180;i++){
    const d=document.createElement('div');d.className='dot-star';
    const sz=.8+Math.random()*1.6;
    const op=.15+Math.random()*.55;
    const mn=op*.15;
    d.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${3+Math.random()*6}s;--dl:${Math.random()*8}s;--op:${op};--mn:${mn}`;
    sl.appendChild(d);
  }
})();

/* LANDING */
(function(){
  const landing=document.getElementById('landing');
  const rope=document.getElementById('rope');
  const lantern=document.getElementById('lantern');
  const flash=document.getElementById('flash');
  let done=false;
  function enter(){
    if(done)return;done=true;
    rope.classList.add('pull');lantern.classList.add('lit');
    flash.classList.add('on');setTimeout(()=>flash.classList.remove('on'),200);
    setTimeout(()=>{landing.classList.add('gone');document.getElementById('app').classList.add('on');},560);
  }
  landing.addEventListener('click',enter);
  let sy=0,drag=false;
  rope.addEventListener('mousedown',e=>{sy=e.clientY;drag=true;e.stopPropagation()});
  document.addEventListener('mousemove',e=>{if(drag&&e.clientY-sy>32)enter()});
  document.addEventListener('mouseup',()=>drag=false);
  rope.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;drag=true},{passive:true});
  document.addEventListener('touchmove',e=>{if(drag&&e.touches[0].clientY-sy>32)enter()},{passive:true});
  document.addEventListener('touchend',()=>drag=false);
})();

let phase='idle',typeTimer=null;

/* DECK CLICK */
document.getElementById('deckZone').addEventListener('click',function(e){
  e.stopPropagation();
  if(phase!=='idle')return;
  phase='ov';
  document.getElementById('btnSh').style.display='';
  document.getElementById('btnDr').style.display='none';
  document.getElementById('ovHint').textContent='สำรับไพ่อยู่ในมือคุณแล้ว';
  document.getElementById('ov').classList.add('on');
});

/* SHUFFLE */
function doShuffle(){
  phase='shuf';
  document.getElementById('btnSh').style.display='none';
  document.getElementById('ovHint').textContent='กำลังสับไพ่...';
  // แม่มดสับไพ่ — เพิ่ม class ให้ SVG animation เร็วขึ้น
  const svg=document.getElementById('witchSvg');
  svg.classList.add('shuffling');
  const deck=document.getElementById('ovDeck');
  const anims=[
    {tx:'52px',ty:'-24px',r:'13deg',tx2:'-34px',ty2:'14px',r2:'-8deg'},
    {tx:'-44px',ty:'-15px',r:'-11deg',tx2:'28px',ty2:'12px',r2:'7deg'},
    {tx:'34px',ty:'22px',r:'17deg',tx2:'-24px',ty2:'-19px',r2:'-12deg'},
  ];
  let n=0;
  anims.forEach((a,i)=>setTimeout(()=>{
    const sc=document.createElement('div');sc.className='sc';sc.textContent='✦';
    sc.style.setProperty('--tx',a.tx);sc.style.setProperty('--ty',a.ty);sc.style.setProperty('--r',a.r);
    sc.style.setProperty('--tx2',a.tx2);sc.style.setProperty('--ty2',a.ty2);sc.style.setProperty('--r2',a.r2);
    deck.appendChild(sc);
    setTimeout(()=>{sc.remove();if(++n===3){
      svg.classList.remove('shuffling');
      phase='ready';
      document.getElementById('ovHint').textContent='จั่วไพ่ได้เลย...';
      document.getElementById('btnDr').style.display='';
    }},440);
  },i*200));
}

/* TYPEWRITER */
function typewrite(el,text,speed=26){
  if(typeTimer)clearInterval(typeTimer);
  el.innerHTML='<span class="cursor"></span>';
  let i=0;
  typeTimer=setInterval(()=>{
    if(i>=text.length){clearInterval(typeTimer);return;}
    el.innerHTML=text.slice(0,++i)+'<span class="cursor"></span>';
  },speed);
}

/* DRAW */
function doDraw(){
  if(phase!=='ready')return;
  phase='drawn';
  document.getElementById('ov').classList.remove('on');
  const card=CARDS[Math.floor(Math.random()*CARDS.length)];

  // วางไพ่บนโต๊ะ
  const dc=document.getElementById('drawnCard');
  document.getElementById('drawnNum').textContent=card.n;
  document.getElementById('drawnEmoji').textContent=card.e;
  dc.style.animation='none';dc.offsetHeight;dc.style.animation='';
  dc.classList.add('show');
  document.querySelector('.deck-stack').style.opacity='0';
  document.querySelector('.deck-lbl').style.opacity='0';

  // แม่มดพูด — speaking class ทำให้ปาก animate
  setTimeout(()=>{
    const svg=document.getElementById('witchSvg');
    svg.classList.add('speaking');
    const bubble=document.getElementById('bubble');
    document.getElementById('bubbleTitle').innerHTML=`${card.e} <strong style="color:var(--gold);font-family:'Cinzel',serif;font-size:.72rem">${card.name}</strong> <span style="color:rgba(201,169,110,.5);font-size:.6rem;font-family:'Sarabun',sans-serif">${card.th}</span>`;
    bubble.classList.add('on');
    typewrite(document.getElementById('bubbleText'),card.m,25);
    // หยุดพูดเมื่อพิมพ์เสร็จ
    setTimeout(()=>{svg.classList.remove('speaking')},card.m.length*25+500);
    setTimeout(()=>document.getElementById('btnAgain').classList.add('on'),card.m.length*25+800);
  },600);
}

/* RESET */
function reset(){
  if(typeTimer)clearInterval(typeTimer);
  phase='idle';
  document.getElementById('drawnCard').classList.remove('show');
  document.querySelector('.deck-stack').style.opacity='';
  document.querySelector('.deck-lbl').style.opacity='';
  document.getElementById('witchSvg').classList.remove('speaking','shuffling');
  document.getElementById('bubble').classList.remove('on');
  document.getElementById('bubbleText').innerHTML='<span class="cursor"></span>';
  document.getElementById('btnAgain').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
}
</script>
